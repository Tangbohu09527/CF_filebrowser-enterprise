name: FileBridge client

on:
  push:
    branches: ['feat/filebridge-hermes-crud']
    paths:
      - 'tools/filebrowser-agentctl/**'
      - 'integrations/hermes-filebridge/**'
      - '.github/workflows/filebridge-client.yaml'
  pull_request:
    paths:
      - 'tools/filebrowser-agentctl/**'
      - 'integrations/hermes-filebridge/**'
      - '.github/workflows/filebridge-client.yaml'

permissions:
  contents: read

concurrency:
  group: filebridge-client-${{ github.ref }}
  cancel-in-progress: false

jobs:
  client:
    name: Client regression (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: tools/filebrowser-agentctl/go.mod
          cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Test and vet independent client
        working-directory: tools/filebrowser-agentctl
        shell: bash
        run: |
          set -euo pipefail
          go version
          unformatted=$(gofmt -l cmd internal)
          printf '%s\n' "$unformatted"
          test -z "$unformatted"
          go test -count=1 ./...
          go vet ./...
      - name: Build isolated inbound worker for native plugin integration tests
        working-directory: tools/filebrowser-agentctl
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/filebridge-inbound"
          if [ "$RUNNER_OS" = Windows ]; then output="$output.exe"; fi
          go build -trimpath -mod=readonly -o "$output" ./cmd/filebridge-inbound
          echo "CF_FILEBRIDGE_INBOUND_TEST_EXE=$output" >> "$GITHUB_ENV"
      - name: Test existing Hermes tools and inbound HTTPS worker wiring
        run: python -B -m unittest discover -s integrations/hermes-filebridge/tests -v
      - name: Verify official Hermes loader, middleware and HTTP request boundary
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/filebridge-hermes-loader"
          echo "CF_HERMES_TEST_SOURCE=$root/source/hermes-agent-4d55ca91656ac5f83e1506679b7f81e0238e5e16" >> "$GITHUB_ENV"
          mkdir -p "$root/source"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://codeload.github.com/NousResearch/hermes-agent/zip/4d55ca91656ac5f83e1506679b7f81e0238e5e16 \
            -o "$root/source.zip"
          unzip -q "$root/source.zip" -d "$root/source"
          python -m venv "$root/venv"
          runner="$root/venv/bin/python"
          if [ "$RUNNER_OS" = Windows ]; then runner="$root/venv/Scripts/python.exe"; fi
          "$runner" -m pip install --disable-pip-version-check -r integrations/hermes-filebridge/tests/hermes-probe-requirements.txt
          "$runner" -I -B integrations/hermes-filebridge/tests/test_hermes_loader.py \
            --hermes-source "$root/source/hermes-agent-4d55ca91656ac5f83e1506679b7f81e0238e5e16"
          "$runner" -I -B integrations/hermes-filebridge/tests/test_hermes_middleware.py \
            --hermes-source "$root/source/hermes-agent-4d55ca91656ac5f83e1506679b7f81e0238e5e16" \
            --worker "$CF_FILEBRIDGE_INBOUND_TEST_EXE"
          "$runner" -I -B integrations/hermes-filebridge/tests/test_hermes_request_probe.py \
            --hermes-source "$root/source/hermes-agent-4d55ca91656ac5f83e1506679b7f81e0238e5e16" --lifecycle
      - name: Python required by the fixed Gateway snapshot (joint test only)
        if: runner.os == 'Linux'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Real Gateway and official Hermes combined chain (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/filebridge-gateway-joint"
          mkdir -p "$root/source"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://codeload.github.com/Tangbohu09527/CF_agent-gateway/zip/0ec54bf0f25f421e37e16e11bd098a814beca258 \
            -o "$root/source.zip"
          echo "c0ad44618fcd7c640c640f921e8910b8292dcadc24dd2c03cc03a34c2761c445  $root/source.zip" | sha256sum -c -
          unzip -q "$root/source.zip" -d "$root/source"
          python -m venv "$root/venv"
          "$root/venv/bin/python" -m pip install --disable-pip-version-check \
            -r integrations/hermes-filebridge/tests/gateway-hermes-joint-requirements.txt
          joint_status=0
          "$root/venv/bin/python" -I -B integrations/hermes-filebridge/tests/test_gateway_hermes_joint.py \
            --gateway-source "$root/source/CF_agent-gateway-0ec54bf0f25f421e37e16e11bd098a814beca258" \
            --gateway-archive "$root/source.zip" \
            --hermes-source "$CF_HERMES_TEST_SOURCE" --worker "$CF_FILEBRIDGE_INBOUND_TEST_EXE" || joint_status=$?
          exit_status=0
          "$root/venv/bin/python" -I -B integrations/hermes-filebridge/tests/test_gateway_hermes_host_exit.py \
            --gateway-source "$root/source/CF_agent-gateway-0ec54bf0f25f421e37e16e11bd098a814beca258" \
            --gateway-archive "$root/source.zip" \
            --hermes-source "$CF_HERMES_TEST_SOURCE" --worker "$CF_FILEBRIDGE_INBOUND_TEST_EXE" || exit_status=$?
          # Run both independent boundaries; either failure keeps the gate red.
          test "$joint_status" -eq 0
          test "$exit_status" -eq 0
      - name: Build client and retain fixed-source inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/filebridge-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/filebridge-evidence/source-sha.txt"
          go version > "$RUNNER_TEMP/filebridge-evidence/go-version.txt"
          git archive --format=tar.gz --output="$RUNNER_TEMP/filebridge-evidence/filebridge-source.tar.gz" HEAD tools/filebrowser-agentctl integrations/hermes-filebridge
          cd tools/filebrowser-agentctl
          output="$RUNNER_TEMP/filebridge-evidence/filebrowser-agentctl"
          if [ "$RUNNER_OS" = Windows ]; then output="$output.exe"; fi
          CGO_ENABLED=0 go build -trimpath -mod=readonly -o "$output" ./cmd/filebrowser-agentctl
          inbound="$RUNNER_TEMP/filebridge-evidence/inbound-bundle"
          mkdir -p "$inbound/plugin"
          binary="filebridge-inbound"
          if [ "$RUNNER_OS" = Windows ]; then binary="$binary.exe"; fi
          CGO_ENABLED=0 go build -trimpath -mod=readonly -o "$inbound/$binary" ./cmd/filebridge-inbound
          cp ../../integrations/hermes-filebridge/plugin/{__init__.py,inbound.py,inbound_control.py,inbound_directory.py,inbound_host.py,plugin.yaml} "$inbound/plugin/"
          INBOUND_BUNDLE="$inbound" python -c 'import hashlib,json,os,pathlib,subprocess; p=pathlib.Path(os.environ["INBOUND_BUNDLE"]); files={f.relative_to(p).as_posix():hashlib.sha256(f.read_bytes()).hexdigest() for f in sorted(p.rglob("*")) if f.is_file()}; (p/"inventory.json").write_text(json.dumps({"schema":"cf-inbound-bundle/v1","source_commit":subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(),"files":files},indent=2)+"\n",encoding="utf-8")'
          git diff --exit-code
          cd "$RUNNER_TEMP/filebridge-evidence"
          sha256sum filebrowser-agentctl* filebridge-source.tar.gz inbound-bundle/inventory.json > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: filebridge-client-${{ matrix.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/filebridge-evidence/
          if-no-files-found: error
          retention-days: 14
