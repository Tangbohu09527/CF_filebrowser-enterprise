name: filebrowser-enterprise

services:
  filebrowser-enterprise:
    image: ${FILEBROWSER_IMAGE:?FILEBROWSER_IMAGE must be an internal image pinned by digest}
    user: "${FILEBROWSER_UID:?FILEBROWSER_UID is required}:${FILEBROWSER_GID:?FILEBROWSER_GID is required}"
    init: true
    restart: unless-stopped
    stop_grace_period: ${STOP_GRACE_PERIOD:-60s}
    read_only: true
    entrypoint:
      - /opt/filebrowser-enterprise/scripts/container-entrypoint.sh
    environment:
      FILEBROWSER_CONFIG: /etc/filebrowser-enterprise/config.yaml
      FILEBROWSER_DATABASE: /var/lib/filebrowser-enterprise/database.db
      FILEBROWSER_JWT_TOKEN_SECRET_FILE: /run/filebrowser-secrets/jwt_token_secret
      FILEBROWSER_TOTP_SECRET_FILE: /run/filebrowser-secrets/totp_secret
      FILEBROWSER_BOOTSTRAP_PASSWORD_FILE: /run/filebrowser-secrets/bootstrap_admin_password
    volumes:
      - type: bind
        source: ${CONFIG_ROOT:?CONFIG_ROOT is required}/config.yaml
        target: /etc/filebrowser-enterprise/config.yaml
        read_only: true
      - type: bind
        source: ${CONFIG_ROOT:?CONFIG_ROOT is required}/secrets
        target: /run/filebrowser-secrets
        read_only: true
      - type: bind
        source: ${DATA_ROOT:?DATA_ROOT is required}
        target: /var/lib/filebrowser-enterprise
      - type: bind
        source: ${CACHE_ROOT:?CACHE_ROOT is required}
        target: /var/cache/filebrowser-enterprise
      - type: bind
        source: ${FILES_ROOT:?FILES_ROOT is required}
        target: /srv/filebrowser/files
      - type: bind
        source: ${DEPLOY_ROOT:?DEPLOY_ROOT is required}/scripts/container-entrypoint.sh
        target: /opt/filebrowser-enterprise/scripts/container-entrypoint.sh
        read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    expose:
      - "8080"
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "app_health=$$(curl --fail --silent --show-error http://127.0.0.1:8080/health) && [ \"$$app_health\" = '{\"message\":\"ok\"}' ]"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: ${FILEBROWSER_PIDS:-256}
    mem_limit: ${FILEBROWSER_MEMORY:-2g}
    cpus: ${FILEBROWSER_CPUS:-2.0}
    logging:
      driver: local
      options:
        max-size: ${LOG_MAX_SIZE:-50m}
        max-file: "${LOG_MAX_FILES:-5}"

  nginx:
    image: ${NGINX_IMAGE:?NGINX_IMAGE must be an approved image pinned by digest}
    user: "${NGINX_UID:?NGINX_UID is required}:${NGINX_GID:?NGINX_GID is required}"
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    entrypoint:
      - /opt/filebrowser-enterprise/scripts/nginx-entrypoint.sh
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?PUBLIC_HOST is required}
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-20g}
      CLIENT_BODY_TIMEOUT: ${CLIENT_BODY_TIMEOUT:-3600s}
      PROXY_READ_TIMEOUT: ${PROXY_READ_TIMEOUT:-3600s}
      PROXY_SEND_TIMEOUT: ${PROXY_SEND_TIMEOUT:-3600s}
      AUTH_RATE: ${AUTH_RATE:-3r/m}
      AUTH_BURST: ${AUTH_BURST:-2}
      AUTH_GLOBAL_RATE: ${AUTH_GLOBAL_RATE:-8r/m}
      AUTH_GLOBAL_BURST: ${AUTH_GLOBAL_BURST:-4}
      TLS_CERT_CONTAINER_PATH: ${TLS_CERT_CONTAINER_PATH:-/etc/nginx/tls/tls.crt}
      TLS_KEY_CONTAINER_PATH: ${TLS_KEY_CONTAINER_PATH:-/etc/nginx/tls/tls.key}
    volumes:
      - type: bind
        source: ${DEPLOY_ROOT:?DEPLOY_ROOT is required}/nginx/nginx.conf
        target: /etc/nginx/nginx.conf
        read_only: true
      - type: bind
        source: ${DEPLOY_ROOT:?DEPLOY_ROOT is required}/nginx/filebrowser.conf.template
        target: /etc/nginx/templates/filebrowser.conf.template
        read_only: true
      - type: bind
        source: ${DEPLOY_ROOT:?DEPLOY_ROOT is required}/scripts/nginx-entrypoint.sh
        target: /opt/filebrowser-enterprise/scripts/nginx-entrypoint.sh
        read_only: true
      - type: bind
        source: ${CONFIG_ROOT:?CONFIG_ROOT is required}/tls
        target: /etc/nginx/tls
        read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m,mode=1777
    ports:
      - "${HTTP_BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-80}:8080"
      - "${HTTPS_BIND_ADDRESS:-127.0.0.1}:${HTTPS_PORT:-443}:8443"
    networks:
      - ingress
      - backend
    depends_on:
      filebrowser-enterprise:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider --no-check-certificate --header=Host:$${PUBLIC_HOST} https://127.0.0.1:8443/nginx-health && backend_health=$$(wget -qO- http://filebrowser-enterprise:8080/health) && printf '%s' \"$$backend_health\" | grep -Fqx '{\"message\":\"ok\"}'"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: ${NGINX_PIDS:-128}
    mem_limit: ${NGINX_MEMORY:-512m}
    cpus: ${NGINX_CPUS:-1.0}
    logging:
      driver: local
      options:
        max-size: ${LOG_MAX_SIZE:-50m}
        max-file: "${LOG_MAX_FILES:-5}"

networks:
  ingress:
    driver: bridge
  backend:
    driver: bridge
    internal: true
